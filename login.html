<!DOCTYPE html>
<html>
<head>
  <title>SCP FOUNDATION TERMINAL</title>
  <link rel="stylesheet" href="style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
    }

    .terminal {
      width: 100%;
      height: 100%;
      max-width: none;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Courier New", monospace;
      color: #b7f7c1;
      background: radial-gradient(circle at center, #0a1118 0%, #05070a 70%);
    }

    input {
      width: 280px;
      padding: 12px;
      margin: 8px 0;
      background: rgba(0,0,0,0.4);
      border: 1px solid #7fffb0;
      color: #d7e0d7;
      font-family: inherit;
      outline: none;
    }

    input::placeholder {
      color: rgba(215,224,215,0.45);
    }

    .btn {
      margin-top: 12px;
      padding: 12px 20px;
      background: transparent;
      border: 1px solid #7fffb0;
      color: #7fffb0;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #7fffb0;
      color: #05070a;
    }

    .warning {
      margin-top: 25px;
      color: #ff6b6b;
      text-align: center;
      letter-spacing: 1px;
      font-size: 0.9rem;
    }

    #warning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.96);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      overflow: hidden;
    }

    .warning-text {
      color: #ff3333;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: glitch 0.15s infinite;
      position: relative;
      line-height: 1.8;
    }

    .scanlines {
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
    }

    @keyframes glitch {
      0% { transform: translate(0px, 0px); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(1px, -1px); }
      60% { transform: translate(-1px, 0px); }
      80% { transform: translate(1px, 1px); }
      100% { transform: translate(0px, 0px); }
    }
  </style>
</head>

<body>

<div class="terminal">
  <h1 id="terminal-title">SCP FOUNDATION</h1>
  <p id="terminal-text">INITIALIZING SECURE ACCESS...</p>

  <input type="text" id="callsign" placeholder="PERSONNEL ID">
  <input type="password" id="accesskey" placeholder="ACCESS CODE">

  <button type="button" class="btn" onclick="checkAccess()">ENTER</button>

  <p class="warning">
    UNIT: SECTOR TWELVE<br>
    CLEARANCE LEVEL REQUIRED<br>
    UNAUTHORIZED ACCESS WILL BE LOGGED
  </p>
</div>

<div id="warning-overlay">
  <div class="warning-text" id="warning-message">ACCESS DENIED</div>
  <div class="scanlines"></div>
</div>

<script>
function typeText(element, text, speed = 40) {
  let i = 0;
  element.innerHTML = '';

  function type() {
    if (i < text.length) {
      if (text.charAt(i) === '\n') {
        element.innerHTML += '<br>';
      } else {
        element.innerHTML += text.charAt(i);
      }
      i++;
      setTimeout(type, speed);
    }
  }

  type();
}

function generateFakeIP() {
  const fakeIPs = [
    "131.199.32.202","77.236.115.28","98.22.40.175","22.97.22.4","85.33.115.61",
    "230.233.145.143","62.83.138.231","172.63.138.84","126.42.87.30","2.134.177.158",
    "212.222.113.92","188.219.52.42","149.22.245.89","5.119.35.228","137.116.176.45",
    "102.133.84.65","244.197.8.48","72.195.236.127","99.243.238.31","29.7.129.251",
    "22.238.24.188","35.137.33.72","242.247.159.172","57.72.87.60","72.245.244.4",
    "210.240.221.120","200.100.144.126","127.98.125.11","252.170.219.115","133.161.210.17",
    "108.182.30.72","167.208.162.123","108.178.130.32","24.62.97.50","131.74.17.111",
    "246.223.122.248","82.233.243.193","74.173.197.46","25.137.17.193","115.27.134.89",
    "11.79.134.100","50.168.89.60","75.115.120.200","170.87.5.157","191.85.74.192",
    "38.246.66.33","176.9.109.108","90.3.112.158","51.87.120.245","225.53.40.16"
  ];

  return fakeIPs[Math.floor(Math.random() * fakeIPs.length)];
}

function checkAccess() {
  const idInput = document.getElementById('callsign');
  const keyInput = document.getElementById('accesskey');

  const id = idInput.value.trim().toUpperCase();
  const key = keyInput.value.trim();

  const terminalText = document.getElementById('terminal-text');
  const overlay = document.getElementById('warning-overlay');
  const warningMessage = document.getElementById('warning-message');

  // AD-X
  if (id === "AD-X" && key === "ALB-XAD") {
    idInput.disabled = true;
    keyInput.disabled = true;
    typeText(terminalText, "ADMINISTRATIVE CLEARANCE ACCEPTED...\nLOADING FOUNDATION DATABASE");
    setTimeout(() => window.location.href = "base.html", 1500);
    return;
  }

  // ST-X
  if (id === "ST-X" && key === "ST12-OV") {
    idInput.disabled = true;
    keyInput.disabled = true;
    typeText(terminalText, "SECTOR TWELVE OVERSEER VERIFIED...\nACCESSING INTERNAL ARCHIVES");
    setTimeout(() => window.location.href = "base.html", 1500);
    return;
  }

  // DIV-4
  if (id === "DIV-4" && key === "26042026") {
    idInput.disabled = true;
    keyInput.disabled = true;
    typeText(terminalText, "OVERWATCH COMMAND, WELCOME, ALEXANDER");
    setTimeout(() => window.location.href = "base.html", 1500);
    return;
  }

  // ISD-DEP
  if (id === "ISD-DEP" && key === "WeCantSaveFoone") {
    idInput.disabled = true;
    keyInput.disabled = true;
    typeText(terminalText, "INTERNAL SECURITY DIVISION LINK ESTABLISHED...\nDEPARTMENT NODE SYNCHRONIZED");
    setTimeout(() => window.location.href = "base.html", 1500);
    return;
  }

  // INVALID
  idInput.disabled = true;
  keyInput.disabled = true;

  typeText(terminalText, "UNAUTHORIZED ACCESS DETECTED...");

  const fakeIP = generateFakeIP();

  setTimeout(() => {
    warningMessage.innerHTML = `
      ACCESS DENIED<br>
      YOU ARE NOT AUTHORIZED TO ENTER<br><br>
      FOUNDATION PERSONNEL ARE<br>
      ALREADY HEADING TO YOUR LOCATION<br><br>
      TRACE ID: ${fakeIP}<br>
      SESSION TERMINATED
    `;
    overlay.style.display = 'flex';
  }, 1000);
}

typeText(document.getElementById('terminal-text'), "INITIALIZING SECURE ACCESS...");
</script>

</body>
</html>
